<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10131d"><title>Регистрация · HabitFlow</title><link rel="stylesheet" href="/static/css/style.css"><script src="/static/js/auth.js" defer></script></head>
<body class="auth-page"><main class="auth-card"><a class="brand" href="/"><span class="brand-mark">H</span> habitflow</a><p class="eyebrow">МАЛЕНЬКИЕ ШАГИ. БОЛЬШИЕ ПЕРЕМЕНЫ.</p><h1>Начни сегодня</h1><p class="muted">Создай аккаунт и собери свою систему привычек.</p><form id="auth-form"><label>Логин<input name="username" autocomplete="username" minlength="3" maxlength="30" pattern="[A-Za-zА-Яа-яЁё0-9_.-]+" required><small>3–30 символов: буквы, цифры, точка, дефис или _</small></label><label>Пароль<input name="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required><small>Не менее 10 символов</small></label><button class="button primary full" type="submit">Создать аккаунт <span>→</span></button><p id="form-error" class="form-error" role="alert"></p></form><p class="auth-switch">Уже есть аккаунт? <a href="/login">Войти</a></p><a class="back-link" href="/">← На главную</a></main></body></html>
